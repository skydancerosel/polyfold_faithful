name = "Polyfold"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Polyfold"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "Polyfold"

# Round-trip audit of the comparison's statements (not part of the default target).
[[lean_lib]]
name = "RoundTrip"

# Formalization of HWZ, Applications of Polyfold Theory I: The Polyfolds of Gromov-Witten Theory
# (Memoirs AMS 248, 2017), built on the book (not part of the default target).
[[lean_lib]]
name = "GWMemoir"
